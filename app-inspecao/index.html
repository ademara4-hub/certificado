<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12305A">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Inspeção de Acessórios de Içamento</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ECEFF3; --card:#FFFFFF; --ink:#15202B; --muted:#5B6976; --line:#D2D9E0; --field:#F6F8FA;
  --navy:#12305A; --head:#12305A; --hi:#F2B300;
  --ok:#2C7549; --okbg:#E1F0E6; --warn:#8C6200; --warnbg:#FBF0D3; --bad:#A92E28; --badbg:#F7E0DD;
  color-scheme: light dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E151C; --card:#16202A; --ink:#E4E9EE; --muted:#97A5B2; --line:#2A3642; --field:#101920;
    --navy:#2A5A95; --head:#A8C5EC; --ok:#7CCB98; --okbg:#173326; --warn:#F0C25A; --warnbg:#382C10; --bad:#F08C84; --badbg:#3A1C1A;
  }
}
:root[data-theme="dark"]{
  --bg:#0E151C; --card:#16202A; --ink:#E4E9EE; --muted:#97A5B2; --line:#2A3642; --field:#101920;
  --navy:#2A5A95; --head:#A8C5EC; --ok:#7CCB98; --okbg:#173326; --warn:#F0C25A; --warnbg:#382C10; --bad:#F08C84; --badbg:#3A1C1A;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;font-size:16px;line-height:1.4;-webkit-text-size-adjust:100%}
img{max-width:100%}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--hi);outline-offset:2px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--navy);color:#fff;display:flex;align-items:center;gap:6px;padding:10px 12px 12px;min-height:58px}
.top::after{content:"";position:absolute;left:0;right:0;bottom:-6px;height:6px;background:repeating-linear-gradient(-45deg,var(--hi) 0 11px,#1A1A1A 11px 22px)}
.top h1{flex:1;margin:0;font-family:'Barlow Condensed','Arial Narrow',Arial,sans-serif;font-weight:700;font-size:23px;letter-spacing:.2px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{appearance:none;border:0;background:rgba(255,255,255,.12);color:#fff;border-radius:9px;min-width:42px;height:40px;padding:0 12px;font-size:16px;font-weight:600;cursor:pointer}
.iconbtn.back{font-size:28px;line-height:1;padding:0 10px 4px}

.wrap{max-width:720px;margin:0 auto;padding:22px 14px 120px}
.block{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
.block h2{font-family:'Barlow Condensed','Arial Narrow',Arial,sans-serif;font-weight:700;font-size:19px;color:var(--head);margin:0 0 10px}
.hint{color:var(--muted);font-size:14px;margin:8px 0 0}

.field{display:block;margin-bottom:12px}
.field:last-child{margin-bottom:0}
.field > span{display:block;font-size:14px;font-weight:600;color:var(--muted);margin-bottom:4px}
input,select,textarea{width:100%;font:inherit;font-size:16px;padding:11px 12px;border:1.5px solid var(--line);border-radius:8px;background:var(--field);color:var(--ink);min-height:46px}
textarea{resize:vertical;min-height:70px}
input:focus,textarea:focus,select:focus{border-color:var(--head);outline:none}
.up{text-transform:uppercase}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 12px}
.field .lbl label{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
input[type=date]{min-width:0}
.ro{padding:11px 12px;border-radius:8px;border:1.5px dashed var(--line);min-height:46px;font-weight:700}

.btn{appearance:none;border:0;border-radius:10px;padding:12px 16px;min-height:50px;font-weight:700;font-size:16px;background:var(--navy);color:#fff;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn.hi{background:var(--hi);color:#1A1A1A}
.btn.ghost{background:transparent;color:var(--head);border:1.5px solid var(--line)}
.btn.danger{background:transparent;color:var(--bad);border:1.5px solid var(--bad)}
.btn:disabled{opacity:.55}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row > .btn{flex:1 1 140px}

.dock{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--card);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center}
.dock .btn{flex:1;max-width:420px}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{appearance:none;border:1.5px solid var(--line);background:var(--field);border-radius:999px;padding:9px 14px;font-weight:600;cursor:pointer;min-height:42px}
.chip[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}

.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-bottom:12px}
.seg button{appearance:none;border:1.5px solid var(--line);background:var(--field);border-radius:10px;min-height:52px;font-weight:700;cursor:pointer}
.seg button[data-r="C"][aria-pressed="true"]{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.seg button[data-r="M"][aria-pressed="true"]{background:var(--warnbg);border-color:var(--warn);color:var(--warn)}
.seg button[data-r="D"][aria-pressed="true"]{background:var(--badbg);border-color:var(--bad);color:var(--bad)}

.pill{display:inline-block;font-size:13px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
.pill.ok{background:var(--okbg);color:var(--ok)}
.pill.warn{background:var(--warnbg);color:var(--warn)}
.pill.bad{background:var(--badbg);color:var(--bad)}
.pill.n{background:var(--field);color:var(--muted);border:1px solid var(--line)}

.list{display:flex;flex-direction:column;gap:10px}
.card{appearance:none;text-align:left;width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;display:block}
.card .t{display:block;font-weight:700;font-size:17px;margin-bottom:2px}
.card .s{display:block;color:var(--muted);font-size:14px;margin-bottom:8px}
.card .pills{display:flex;gap:6px;flex-wrap:wrap}

.item{display:grid;grid-template-columns:62px 1fr auto;gap:12px;align-items:center;padding:10px}
.item img{width:62px;height:62px;object-fit:cover;border-radius:8px;background:#fff;border:1px solid var(--line)}
.item .t{font-size:15px;margin:0;line-height:1.25}
.item .s{margin:2px 0 0}
.num{font-family:'Barlow Condensed','Arial Narrow',Arial,sans-serif;color:var(--muted);font-weight:700;margin-right:4px}

.sum{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.sum div{background:var(--field);border:1px solid var(--line);border-radius:10px;padding:8px 6px;text-align:center}
[hidden]{display:none!important}
.btn.ia-btn{width:100%;margin-top:12px;background:var(--field);color:var(--head);border:1.5px dashed var(--head)}
.ia-ok{border-color:var(--ok)!important;background:var(--okbg)!important}
.ia-duv{border-color:var(--warn)!important;background:var(--warnbg)!important}
.field .lbl{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:14px;font-weight:600;color:var(--muted);margin-bottom:4px}
.pin{appearance:none;border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:999px;font-size:12px;font-weight:700;padding:3px 9px;min-height:28px;cursor:pointer;white-space:nowrap}
.pin[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.sumnote{font-family:'Barlow',system-ui,sans-serif;font-size:13px;font-weight:700;color:var(--muted);margin-left:auto;margin-right:10px}
.pf > label{display:block;font-size:14px;font-weight:600;color:var(--muted);margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pfrow{display:flex;gap:6px;align-items:stretch}
.pfrow > input,.pfrow > textarea{flex:1;min-width:0}
.pin{appearance:none;flex:0 0 44px;width:44px;min-height:46px;border:1.5px solid var(--line);background:var(--field);color:var(--muted);border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.pin[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.grid2.pins{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.pf.wide{grid-column:1/-1}
.sumnote{font-family:'Barlow',system-ui,sans-serif;font-size:13px;font-weight:700;color:var(--muted);margin-left:auto;margin-right:10px}
.seg button{padding:6px 2px;font-size:clamp(12px,3.7vw,16px);line-height:1.15;min-width:0;white-space:nowrap}
.sum span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.head{margin-bottom:12px}
.meta{margin:0 0 3px;color:var(--muted);font-size:15px}
.as-btn{border:0;cursor:pointer;font-family:inherit;margin-top:6px}
.sum.filt{margin-top:14px}
.sum > *{background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:8px 4px;text-align:center}
.sum button{appearance:none;cursor:pointer;font:inherit;color:inherit;min-height:58px}
.sum button[aria-pressed="true"]{border-color:var(--head);box-shadow:inset 0 0 0 1px var(--head)}
.search{margin:2px 0 12px;background:var(--card)}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;padding:2px 2px 4px;scrollbar-width:none}
.chips.scroll::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;flex:0 0 auto}
.valline{margin:-2px 0 12px;font-weight:700}
.slot .add{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:15px}
.slot .add b{font-size:30px;line-height:1;font-weight:500}
details.more{padding:0}
details.more > summary{list-style:none;cursor:pointer;padding:14px;font-family:'Barlow Condensed','Arial Narrow',Arial,sans-serif;font-weight:700;font-size:19px;color:var(--head);display:flex;justify-content:space-between;align-items:center}
details.more > summary::-webkit-details-marker{display:none}
details.more > summary::after{content:"+";font-size:24px;line-height:1}
details.more[open] > summary::after{content:"\2212"}
details.more > .inner{padding:0 14px 14px}
.iconbtn.menu{font-size:26px;line-height:1;padding:0 12px 8px}
.dock{gap:10px}

.sum b{display:block;font-family:'Barlow Condensed','Arial Narrow',Arial,sans-serif;font-size:26px;line-height:1}
.sum span{font-size:12px;color:var(--muted);font-weight:600}
.sum .ok b{color:var(--ok)} .sum .warn b{color:var(--warn)} .sum .bad b{color:var(--bad)}
dl.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:0;font-size:15px}
dl.kv dt{color:var(--muted);font-weight:600}
dl.kv dd{margin:0;font-weight:600;overflow-wrap:anywhere}

.diag{display:block;width:100%;max-width:360px;max-height:230px;object-fit:contain;margin:0 auto 12px;background:#fff;border-radius:8px;border:1px solid var(--line)}
.photos{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.slot{position:relative;width:100%;aspect-ratio:3/4;border:2px dashed var(--line);border-radius:12px;background:var(--field);display:flex;align-items:center;justify-content:center;cursor:pointer;overflow:hidden;color:var(--muted);font-weight:700;padding:0}
.slot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.slot.has{border-style:solid}
.rm{position:absolute;right:6px;bottom:6px;z-index:2;border:0;border-radius:8px;background:rgba(0,0,0,.72);color:#fff;font-weight:700;padding:8px 10px;cursor:pointer}
.logo-prev{display:flex;align-items:center;justify-content:center;height:90px;border:1.5px dashed var(--line);border-radius:10px;background:#fff;margin-bottom:10px;color:#777;font-weight:600}
.logo-prev img{max-height:76px;max-width:90%}

.empty{text-align:center;padding:36px 16px;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:18px;margin-bottom:6px}
.link{appearance:none;background:none;border:0;color:var(--head);font-weight:600;text-decoration:underline;padding:6px 0;cursor:pointer;font-size:14px}

#toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:#1E2730;color:#fff;padding:11px 16px;border-radius:10px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:50;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.modal{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:20px}
.modal .box{background:var(--card);border-radius:14px;padding:18px;max-width:420px;width:100%}
.modal p{margin:0 0 16px;font-size:16px;white-space:pre-line}
@media (prefers-reduced-motion: reduce){#toast{transition:none}}
@media (max-width:360px){.sum{grid-template-columns:repeat(2,1fr)}}
</style>
</head>

<script>
'use strict';
const SELF_HTML = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const up = s => String(s ?? '').toUpperCase();
const slug = s => String(s || 'arquivo').normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^A-Za-z0-9]+/g, '_').replace(/^_|_$/g, '').slice(0, 50) || 'arquivo';

/* ---------- Dados fixos ---------- */
const CFG_DEFAULT = {
  empresa: 'Unilink Transportes Integrados LTDA',
  filial: 'Porto do Pecém',
  email: 'Ademar.almeida@unilinktrasnportes.com.br',
  certificacao: 'RT 077/2021',
  inspetor: 'Ademar de Almeida Menezes',
  regInspetor: 'RT 077/2021',
  respTecnico: 'João Wellington Menezes Brilhante',
  regResp: '9523D CE',
  formCodigo: 'FR 8.5-16',
  formRevisao: '00',
  formData: '25/08/23',
  tipoInspecao: 'VISUAL | DIMENSIONAL',
  logo: null
};
const TIPOS = {
  manilha:  { label: 'Manilha',            desc: 'MANILHA CURVA ',        norma: 'NBR 13545 E ASME B30.26' },
  cinta:    { label: 'Cinta',              desc: 'CINTA DE POLIÉSTER ',   norma: 'NBR 15637 E ASME B30.9' },
  corrente: { label: 'Corrente / Linga',   desc: 'LINGA DE CORRENTE ',    norma: 'NBR ISO 3076 E ASME B30.9' },
  cabo:     { label: 'Cabo de aço',        desc: 'LAÇO DE CABO DE AÇO ',  norma: 'NBR ISO 4309 E ASME B30.9' },
  gancho:   { label: 'Gancho',             desc: 'GANCHO ',               norma: 'ASME B30.10' },
  outro:    { label: 'Outro',              desc: '',                      norma: 'ASME B30.26' }
};
const RES = {
  C: { t: 'CONFORME',      cls: 'ok',   label: 'Conforme',   rgb: [44, 117, 73] },
  M: { t: 'EM MANUTENÇÃO', cls: 'warn', label: 'Manutenção', rgb: [176, 118, 0] },
  D: { t: 'DESCARTADO',    cls: 'bad',  label: 'Descarte',   rgb: [169, 46, 40] }
};
const obsPadrao = (tipo, r) => {
  const n = (TIPOS[tipo] || TIPOS.outro).norma;
  return r === 'C' ? `CONFORME ${n}` : r === 'M' ? `ENCAMINHADO PARA MANUTENÇÃO - ${n}` : `REPROVADO PARA USO - DESCARTAR - ${n}`;

  if (!iso) return '';

  dt.setDate(Math.min(d, last));

}

let _db;
function openDB() {
  return new Promise((res, rej) => {
    const r = indexedDB.open('inspecao-acessorios', 2);
    r.onupgradeneeded = () => {
      const d = r.result, has = n => d.objectStoreNames.contains(n);
      if (!has('inspecoes')) d.createObjectStore('inspecoes', { keyPath: 'id' });
      if (!has('itens')) d.createObjectStore('itens', { keyPath: 'id' }).createIndex('inspId', 'inspId');
      if (!has('config')) d.createObjectStore('config');
      if (!has('fotos')) d.createObjectStore('fotos');
    };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
function tx(stores, mode, fn) {
  return new Promise((res, rej) => {
    const t = _db.transaction(stores, mode);
    let out;
    const r = fn(t);
    t.oncomplete = () => res(r && 'result' in r ? r.result : out);
    t.onerror = () => rej(t.error);
    t.onabort = () => rej(t.error);
  });
}
const DB = {
  all: st => tx(st, 'readonly', t => t.objectStore(st).getAll()),
  get: (st, k) => tx(st, 'readonly', t => t.objectStore(st).get(k)),
  put: (st, v, k) => tx(st, 'readwrite', t => k === undefined ? t.objectStore(st).put(v) : t.objectStore(st).put(v, k)),
  del: (st, k) => tx(st, 'readwrite', t => t.objectStore(st).delete(k)),
  byInsp: id => tx('itens', 'readonly', t => t.objectStore('itens').index('inspId').getAll(id)),
  delInsp: async id => {
    const ids = (await DB.byInsp(id)).map(i => i.id);
    return tx(['itens', 'inspecoes', 'fotos'], 'readwrite', t => {
      ids.forEach(k => { t.objectStore('itens').delete(k); t.objectStore('fotos').delete(k + ':0'); t.objectStore('fotos').delete(k + ':1'); });
      t.objectStore('inspecoes').delete(id);
    });
  },
  fotosDe: id => tx('fotos', 'readonly', t => { const st = t.objectStore('fotos'); const a = st.get(id + ':0'), b = st.get(id + ':1'); return { get result() { return [a.result || null, b.result || null]; } }; }),
  saveItem: (it, fotos) => tx(['itens', 'fotos'], 'readwrite', t => {
    t.objectStore('itens').put(it);
    fotos.forEach((f, i) => { const k = it.id + ':' + i; f ? t.objectStore('fotos').put(f, k) : t.objectStore('fotos').delete(k); });
  }),
  delItem: id => tx(['itens', 'fotos'], 'readwrite', t => { t.objectStore('itens').delete(id); t.objectStore('fotos').delete(id + ':0'); t.objectStore('fotos').delete(id + ':1'); })
};
function thumbOf(dataUrl, max = 220) {
  return new Promise(res => {
    const img = new Image();
    img.onload = () => { const r = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight)); const c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth * r); c.height = Math.round(img.naturalHeight * r); const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height); res(c.toDataURL('image/jpeg', 0.6)); };
    img.onerror = () => res(null); img.src = dataUrl;
  });
}
/* converte itens antigos (fotos dentro do item) para o novo formato */
async function migrate() {
  if (await DB.get('config', 'v2')) return;
  for (const it of await DB.all('itens')) {
    if (Array.isArray(it.fotos)) {
      const f = [it.fotos[0] || null, it.fotos[1] || null];
      it.thumbs = await Promise.all(f.map(x => x ? thumbOf(x) : null));
      delete it.fotos;
      await DB.saveItem(it, f);
    }
  }
  await DB.put('config', true, 'v2');
}

async function loadCfg() { CFG = Object.assign({}, CFG_DEFAULT, (await DB.get('config', 'cfg')) || {}); if (CFG.logo == null) CFG.logo = LOGO_PADRAO; }
const safeImg = s => typeof s === 'string' && /^data:image\/(png|jpe?g|webp|gif);base64,[A-Za-z0-9+/=]+$/.test(s) ? s : '';
const clearDraft = () => DB.del('config', 'draft').catch(() => {});
async function itensOrdenados(inspId) { return (await DB.byInsp(inspId)).sort((a, b) => a.ordem - b.ordem); }
async function recount(inspId) {
  const insp = await DB.get('inspecoes', inspId); if (!insp) return;
  const it = await DB.byInsp(inspId);
  insp.cont = { total: it.length, C: it.filter(i => i.resultado === 'C').length, M: it.filter(i => i.resultado === 'M').length, D: it.filter(i => i.resultado === 'D').length };
  await DB.put('inspecoes', insp);
}

/* ---------- UI helpers ---------- */
let toastT;
function toast(msg, ms = 2400) { const el = $('#toast'); el.textContent = msg; el.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('on'), ms); }
function choose(msg, opts) {
  return new Promise(res => {
    const m = document.createElement('div'); m.className = 'modal';
    m.innerHTML = `<div class="box" role="dialog" aria-modal="true"><p>${esc(msg)}</p><div class="stack">${opts.map((o, i) => `<button class="btn ${o.cls || ''}" data-a="${i}">${esc(o.label)}</button>`).join('')}</div></div>`;
    m.addEventListener('click', e => { const a = e.target.closest('[data-a]'); if (!a && e.target !== m) return; m.remove(); res(a ? opts[+a.dataset.a].value : null); });
    document.body.appendChild(m); m.querySelector('[data-a="0"]').focus();
  });
}
const ask = (msg, ok = 'Confirmar', danger = false) => choose(msg, [{ label: ok, value: true, cls: danger ? 'danger' : '' }, { label: 'Cancelar', value: false, cls: 'ghost' }]).then(v => !!v);
const topbar = (title, back, menu) => `<header class="top">${back ? `<button class="iconbtn back" id="back" aria-label="Voltar">‹</button>` : ''}<h1>${esc(title)}</h1>${!back ? `<button class="iconbtn" id="goCfg">Ajustes</button>` : ''}${menu ? `<button class="iconbtn menu" id="menu" aria-label="Mais opções">⋯</button>` : ''}</header>`;
const field = (label, f, val, attrs = '') => `<label class="field"><span>${label}</span><input data-f="${f}" value="${esc(val)}" ${attrs}></label>`;
const pills = c => {
  c = c || {};
  const o = [`<span class="pill n">${c.total || 0} itens</span>`];
  if (c.C) o.push(`<span class="pill ok">${c.C} conforme${c.C > 1 ? 's' : ''}</span>`);
  if (c.M) o.push(`<span class="pill warn">${c.M} manutenção</span>`);
  if (c.D) o.push(`<span class="pill bad">${c.D} descarte</span>`);
  return o.join('');
};
function compress(file, max = 1400, fmt = 'image/jpeg', q = 0.8) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file); const img = new Image();
    img.onload = () => {
      let w = img.naturalWidth, h = img.naturalHeight; const r = Math.min(1, max / Math.max(w, h));
      w = Math.round(w * r); h = Math.round(h * r);
      const c = document.createElement('canvas'); c.width = w; c.height = h; const g = c.getContext('2d');
      if (fmt === 'image/jpeg') { g.fillStyle = '#fff'; g.fillRect(0, 0, w, h); }
      g.drawImage(img, 0, 0, w, h); URL.revokeObjectURL(url); res(c.toDataURL(fmt, q));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('Imagem inválida')); };
    img.src = url;
  });
}

/* ---------- Salvar arquivos ---------- */
let dlPromise = null;
function getDownloads() {
  if (!dlPromise) dlPromise = (window.claude && typeof window.claude.use === 'function') ? window.claude.use('downloads').catch(() => null) : Promise.resolve(null);
  return dlPromise;
}
async function saveFile(name, blob) {

/* Entrega o arquivo: compartilhar (WhatsApp, Drive, e-mail…) ou salvar no celular */
const podeCompartilhar = () => { try { return !window.AndroidApp && window.top === window && !!navigator.canShare; } catch (e) { return false; } };
async function entregar(rotulo, nome, blob, t0, alt) {
  if (!podeCompartilhar()) {
    if (!window.AndroidApp && Date.now() - t0 >= 3500 && !(await choose(`${rotulo}.`, [{ label: 'Baixar', value: true }, { label: 'Cancelar', value: false, cls: 'ghost' }]))) return false;
    return saveFile(nome, blob);
  }
  const op = await choose(`${rotulo}.`, [
    { label: 'Enviar (WhatsApp, e-mail, Drive…)', value: 'share' },
    { label: 'Salvar no celular', value: 'save', cls: 'ghost' },
    { label: 'Cancelar', value: null, cls: 'ghost' }]);
  if (!op) return false;
  if (op === 'save') return saveFile(nome, blob);
  let file = new File([blob], nome, { type: blob.type || 'application/octet-stream' });
  if (!navigator.canShare({ files: [file] })) {
    // o Chrome só deixa enviar alguns tipos (PDF, imagem, texto, CSV); para os outros usa um formato aceito
    const a = alt ? await alt() : null;
    if (!a) return salvarEAnexar(nome, blob);
    file = new File([a.blob], a.nome, { type: a.blob.type });
    if (!navigator.canShare({ files: [file] })) return salvarEAnexar(nome, blob);
  }
  try { await navigator.share({ files: [file], title: file.name }); return true; }
  catch (e) {
    if (e && e.name === 'AbortError') return false;
    return salvarEAnexar(nome, blob);
  }
}
async function salvarEAnexar(nome, blob) {
  const ok = await saveFile(nome, blob);
  if (ok) await choose(`O celular não deixa o app enviar esse tipo de arquivo direto. Ele foi salvo na pasta Download. Para mandar: no WhatsApp toque no clipe 📎 → Documento → escolha "${nome}".`, [{ label: 'Entendi', value: true }]);
  return ok;
}

async function pdfGeral(inspId, lote) {
  let t0 = Date.now();
  const insp = await DB.get('inspecoes', inspId); const itens = await itensOrdenados(inspId);
  if (lote && itens.length > lote) lote = Math.ceil(itens.length / Math.ceil(itens.length / lote)); // partes equilibradas
  const partes = [];
  for (let i = 0; i < itens.length; i += (lote || itens.length || 1)) partes.push(itens.slice(i, i + (lote || itens.length)));
  if (!partes.length) partes.push([]);
  let feitos = 0;
  for (let p = 0; p < partes.length; p++) {
    let doc = newDoc(), first = true;
    if (p === 0) { summaryPages(doc, insp, itens); first = false; }
    for (const it of partes[p]) {
      if (!first) doc.addPage(); first = false;
      certPage(doc, insp, it, await DB.fotosDe(it.id));
      if (++feitos % 10 === 0) { toast(`Montando certificados ${feitos} de ${itens.length}`, 1500); await new Promise(r => setTimeout(r, 0)); }
    }
    const sfx = partes.length > 1 ? `_parte${p + 1}de${partes.length}` : '';
    numberPages(doc, insp.titulo + (partes.length > 1 ? ` - parte ${p + 1} de ${partes.length}` : ''));
    const blob = doc.output('blob'); doc = null;
    const nomePdf = `Inspecao_${slug(insp.titulo)}_${insp.dataInicio}${sfx}.pdf`;
    await entregar(partes.length > 1 ? `A parte ${p + 1} de ${partes.length} do PDF está pronta` : 'O PDF está pronto', nomePdf, blob, partes.length > 1 ? 0 : t0);
    t0 = Date.now();
  }
}

  const doc = newDoc(); certPage(doc, insp, it, fotos); numberPages(doc, insp.titulo);

}
async function working(label, fn) {
  toast(label, 120000);
  try { await new Promise(r => setTimeout(r, 30)); await fn(); }
  catch (e) { console.error(e); toast('Erro: ' + (e.message || e), 4000); return; }
  if ($('#toast').textContent === label) $('#toast').classList.remove('on');
}
async function busy(btn, label, fn) {
  const old = btn.textContent; btn.disabled = true; btn.textContent = label;
  try { await new Promise(r => setTimeout(r, 30)); await fn(); }
  catch (e) { console.error(e); toast('Erro: ' + (e.message || e)); }

/* ---------- Backup ---------- */
/* Leitura em pedaços: não carrega o arquivo inteiro na memória (backups de centenas de MB) */
const BK_CH = 4 * 1024 * 1024;
async function lerBackup(file) {
  const MARK = ',"fotos":{';
  const dec = new TextDecoder();
  let pos = 0, head = '';
  while (pos < file.size && head.length < 150 * 1024 * 1024) {
    head += dec.decode(await file.slice(pos, pos + BK_CH).arrayBuffer(), { stream: true }); pos += BK_CH;
    const i = head.indexOf(MARK);
    if (i >= 0) return { d: JSON.parse(head.slice(0, i) + '}'), fs: { file, pos, resto: head.slice(i + MARK.length), dec } };
  }
  return { d: JSON.parse(await file.text()), fs: null }; // formato antigo
}
async function importarFotos(fs, prog) {
  let buf = fs.resto, pos = fs.pos, n = 0, lote = [];
  const re = /\s*,?\s*"((?:[^"\\]|\\.)*)"\s*:\s*"((?:[^"\\]|\\.)*)"/y;
  const un = x => x.includes('\\') ? JSON.parse('"' + x + '"') : x;
  const flush = async () => { if (!lote.length) return; const l = lote; lote = []; await tx('fotos', 'readwrite', t => { const st = t.objectStore('fotos'); l.forEach(([k, v]) => st.put(v, k)); }); };
  for (;;) {
    re.lastIndex = 0; let m, fim = 0;
    while ((m = re.exec(buf))) { lote.push([un(m[1]), un(m[2])]); fim = re.lastIndex; n++; if (lote.length >= 20) { await flush(); prog(n); } }
    buf = buf.slice(fim);
    if (pos >= fs.file.size) break;
    buf += fs.dec.decode(await fs.file.slice(pos, pos + BK_CH).arrayBuffer(), { stream: true }); pos += BK_CH;
  }
  await flush();
  if (!/^\s*}\s*}\s*$/.test(buf)) throw new Error('o arquivo de backup parece cortado (incompleto). O que foi lido até aqui foi importado.');
  return n;
}
async function exportBackup(inspId) {
  const t0 = Date.now();
  const insps = (await DB.all('inspecoes')).filter(i => !inspId || i.id === inspId);
  const itens = inspId ? await DB.byInsp(inspId) : await DB.all('itens');
  const ids = new Set(itens.map(i => i.id));
  const parts = ['{"app":"inspecao-acessorios","versao":2,"exportadoEm":', JSON.stringify(new Date().toISOString()), ',"config":', JSON.stringify(CFG),
    ',"inspecoes":', JSON.stringify(insps), ',"itens":', JSON.stringify(itens), ',"fotos":{'];
  let first = true;
  await new Promise((res, rej) => {
    const t = _db.transaction('fotos'), c = t.objectStore('fotos').openCursor();
    c.onsuccess = () => {
      const cur = c.result; if (!cur) return;
      const k = String(cur.key);
      if (!inspId || ids.has(k.split(':')[0])) { parts.push(new Blob([(first ? '' : ',') + JSON.stringify(k) + ':' + JSON.stringify(cur.value)])); first = false; }
      cur.continue();
    };
    t.oncomplete = res; t.onerror = () => rej(t.error);
  });
  parts.push('}}');
  const nome = inspId ? `backup_${slug(insps[0]?.titulo)}_${todayISO()}.json` : `backup_inspecoes_${todayISO()}.json`;
  const bk = new Blob(parts, { type: 'application/json' });
  return entregar('O backup está pronto', nome, bk, t0, async () => ({ nome: nome + '.txt', blob: new Blob([bk], { type: 'text/plain' }) }));
}

      </div>
    </section>
    <details class="block more"><summary>Mais detalhes <span class="sumnote" id="pinNote"></span></summary><div class="inner">
      <p class="hint" style="margin:0 0 12px">Toque no <b>alfinete</b> ao lado do campo para fixar o valor: ele já vem preenchido nos próximos acessórios desta inspeção. O PC avança sozinho (03/08 → 04/08).</p>
      <div class="grid2 pins">
        ${fp('Data da inspeção', 'data', it.data, 'type="date"', true)}
        ${fp('Rast.', 'rast', it.rast, 'class="up"')}
        ${fp('PC', 'pc', it.pc, 'class="up" placeholder="01/08"')}
        ${fp('Proteção', 'protecao', it.protecao, 'class="up"')}
        ${fp('Gancho', 'gancho', it.gancho, 'class="up"')}
        ${fp('Elos', 'elos', it.elos, 'class="up"')}
        ${fp('Anelão', 'anelao', it.anelao, 'class="up"')}
      </div>
      <img id="diag" class="diag" style="margin-top:12px" alt="Desenho do tipo de acessório">
    </div></details>
    <section class="block"><h2>Resultado</h2>
      <div class="seg" id="res">${Object.entries(RES).map(([k, r]) => `<button type="button" data-r="${k}" aria-pressed="${k === it.resultado}">${r.label}</button>`).join('')}</div>
      <p class="valline" id="val"></p>
      <label class="field"><span>Observação</span><textarea data-f="obs" class="up" rows="2">${esc(it.obs)}</textarea></label>
      <button type="button" class="link" id="obsReset">Usar texto padrão da norma</button>
    </section>
    <section class="block"><h2>Fotos</h2>
      <div class="photos">${[0, 1].map(i => `<div><button type="button" class="slot" data-slot="${i}" aria-label="Foto ${i + 1}"></button><input type="file" accept="image/*" data-file="${i}" hidden><input type="file" accept="image/*" capture="environment" data-cam="${i}" hidden></div>`).join('')}</div>
    </section>
  </div>
  <div class="dock"><button class="btn ghost" id="saveCopy">Salvar e próximo</button><button class="btn" id="save">Salvar</button></div>`;

  const inp = f => $(`[data-f="${f}"]`);
  const collect = () => $$('[data-f]').forEach(el => it[el.dataset.f] = el.value.trim());
  const paintRes = () => {
    $$('#res button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.r === it.resultado)));
    const val = $('#val');
    val.textContent = it.resultado === 'C' ? `Válido até ${br(insp.validade)}` : it.resultado === 'M' ? 'Em manutenção: sai sem validade' : 'Descartado: sai sem validade';
    val.style.color = it.resultado === 'C' ? 'var(--ok)' : it.resultado === 'M' ? 'var(--warn)' : 'var(--bad)';
  };
  const paintSlots = () => $$('.slot').forEach(s => {
    const i = +s.dataset.slot, f = fotos[i];
    s.classList.toggle('has', !!f);
    s.innerHTML = f ? `<img src="${safeImg(f)}" alt="Foto ${i + 1}"><span class="rm" data-rm="${i}" role="button" tabindex="0">Remover</span>` : `<span class="add"><b>+</b>Foto ${i + 1}</span>`;
  });
  $('#diag').src = diagram(it.tipo);
  paintRes(); paintSlots();
  const paintPins = () => {
    const n = PINAVEIS.filter(k => pins.has(k) && !['descricao', 'cmt', 'comprimento', 'fabricante'].includes(k)).length;
    $('#pinNote').textContent = n ? `${n} fixado${n > 1 ? 's' : ''}` : '';
  };
  paintPins();
  $$('.pin').forEach(b => b.onclick = () => {
    const k = b.dataset.pin; pins.has(k) ? pins.delete(k) : pins.add(k);
    b.setAttribute('aria-pressed', String(pins.has(k))); paintPins();
    toast(pins.has(k) ? 'Fixado: vai se repetir nos próximos' : 'Não está mais fixado', 1600);
  });
  let draftT;
  const saveDraft = () => { clearTimeout(draftT); draftT = setTimeout(() => { collect(); DB.put('config', { inspId: insp.id, isNew, it, fotos, thumbs, quando: Date.now() }, 'draft').catch(() => {}); }, 600); };
  const wrapEl = app.querySelector('.wrap'); wrapEl.addEventListener('input', saveDraft); wrapEl.addEventListener('click', e => { if (e.target.closest('#tipos .chip, #res button, #obsReset')) saveDraft(); });
  if (v.draft) toast('Acessório não salvo recuperado');
  const sel = $('#tipos [aria-pressed="true"]'); if (sel) sel.scrollIntoView({ inline: 'center', block: 'nearest' });

  $$('#tipos .chip').forEach(c => c.onclick = () => {
    collect();
    const old = it.tipo; it.tipo = c.dataset.tipo;
    $$('#tipos .chip').forEach(x => x.setAttribute('aria-pressed', String(x === c)));
    if (!it.descricao || up(it.descricao) === up(TIPOS[old].desc.trim())) inp('descricao').value = TIPOS[it.tipo].desc;
    if (it.obsAuto) inp('obs').value = obsPadrao(it.tipo, it.resultado);
    $('#diag').src = diagram(it.tipo);
  });
  $$('#res button').forEach(b => b.onclick = () => { it.resultado = b.dataset.r; paintRes(); if (it.obsAuto) inp('obs').value = obsPadrao(it.tipo, it.resultado); });
  inp('obs').oninput = () => { it.obsAuto = false; };
  $('#obsReset').onclick = () => { it.obsAuto = true; inp('obs').value = obsPadrao(it.tipo, it.resultado); };
  $$('.slot').forEach(s => s.onclick = async e => {
    const i = +s.dataset.slot;
    if (e.target.closest('[data-rm]')) { fotos[i] = null; thumbs[i] = null; paintSlots(); saveDraft(); return; }
    const origem = await choose(`Foto ${i + 1}`, [
      { label: 'Tirar foto com a câmera', value: 'cam' },
      { label: 'Escolher da galeria', value: 'gal', cls: 'ghost' },
      { label: 'Cancelar', value: null, cls: 'ghost' }]);
    if (!origem) return;
    $(origem === 'cam' ? `[data-cam="${i}"]` : `[data-file="${i}"]`).click();
  });
  $$('[data-file], [data-cam]').forEach(f => f.onchange = async () => {
    const file = f.files && f.files[0]; f.value = ''; if (!file) return;
    try { toast('Processando foto…', 1200); const i = +(f.dataset.file ?? f.dataset.cam); fotos[i] = await compress(file, 1280, 'image/jpeg', 0.75); thumbs[i] = await thumbOf(fotos[i]); paintSlots(); saveDraft(); }
    catch (e) { toast('Não foi possível ler essa imagem'); }
  });

  /* ---- Leitura de etiqueta com IA (Gemini via serviço no Cloudflare) ---- */
  const IA_CAMPOS = ['plaqueta', 'descricao', 'cmt', 'comprimento', 'fabricante', 'rast', 'pc'];
  const lerEtiqueta = async file => {
    if (!navigator.onLine) { toast('Sem internet: a leitura por IA precisa de sinal. Preencha manualmente.', 4000); return; }
    toast('Lendo etiqueta…', 60000);
    let foto;
    try { foto = await compress(file, 1600, 'image/jpeg', 0.82); } catch (e) { toast('Não foi possível ler essa imagem'); return; }
    let r;
    try {
      const ctl = new AbortController(); const tm = setTimeout(() => ctl.abort(), 45000);
      const resp = await fetch(CFG.iaUrl, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ image: foto }), signal: ctl.signal });
      clearTimeout(tm);
      r = await resp.json().catch(() => ({}));
      if (!resp.ok) throw new Error(r.erro || ('serviço respondeu ' + resp.status));
    } catch (e) {
      toast(e.name === 'AbortError' ? 'A leitura demorou demais. Tente de novo.' : e instanceof TypeError ? 'Não deu para falar com o serviço de IA. Confira a internet e o endereço em Ajustes.' : 'Não deu para ler: ' + e.message, 5000); return;
    }
    collect();
    if (r.tipo && TIPOS[r.tipo] && r.tipo !== it.tipo) { const c = $(`#tipos [data-tipo="${r.tipo}"]`); if (c) c.click(); }
    const duv = new Set((r.duvidas || []).map(String));
    let n = 0;
    IA_CAMPOS.forEach(k => {
      const v = String(r[k] ?? '').trim(); const el = inp(k); if (!el) return;
      if (v) { el.value = up(v); n++; }
      el.classList.remove('ia-ok', 'ia-duv');
      if (v) el.classList.add(duv.has(k) ? 'ia-duv' : 'ia-ok');
      else if (duv.has(k)) el.classList.add('ia-duv');
    });
    if ((r.rast || r.pc) && $('details.more')) $('details.more').open = true;
    $$('.ia-ok, .ia-duv').forEach(el => el.addEventListener('input', () => el.classList.remove('ia-ok', 'ia-duv'), { once: true }));
    if (!fotos[0]) { fotos[0] = await compress(file, 1280, 'image/jpeg', 0.75); thumbs[0] = await thumbOf(fotos[0]); paintSlots(); }
    collect(); saveDraft();
    $('#toast').classList.remove('on');
    const msg = `IA preencheu ${n} campo${n === 1 ? '' : 's'}. Verde = lido com confiança; amarelo = confira. Revise tudo antes de salvar.` + (r.observacao ? `\n\nNota da IA: ${r.observacao}` : '');
    if (r.etiqueta_legivel === false) {
      const op = await choose(msg + '\n\nA etiqueta parece ilegível ou danificada.', [
        { label: 'Marcar Manutenção (etiqueta ilegível)', value: 'm' }, { label: 'Só conferir os campos', value: null, cls: 'ghost' }]);
      if (op === 'm') { const b = $('#res [data-r="M"]'); if (b) b.click(); inp('obs').value = 'ETIQUETA ILEGÍVEL'; it.obsAuto = false; saveDraft(); }
    } else await choose(msg, [{ label: 'Conferir', value: true }]);
  };
  if ($('#iaLer')) {
    $('#iaLer').onclick = async () => {
      const o = await choose('Ler etiqueta', [{ label: 'Tirar foto da etiqueta', value: 'cam' }, { label: 'Escolher da galeria', value: 'gal', cls: 'ghost' }, { label: 'Cancelar', value: null, cls: 'ghost' }]);
      if (o) $(o === 'cam' ? '#iaCam' : '#iaGal').click();
    };
    ['#iaCam', '#iaGal'].forEach(id => $(id).onchange = e => { const f = e.target.files && e.target.files[0]; e.target.value = ''; if (f) lerEtiqueta(f); });
  }

  let salvando = false;
  const save = async () => {
    if (salvando) return false;
    salvando = true;
    try { return await saveReal(); } finally { salvando = false; }
  };
  const saveReal = async () => {
    collect();
    if (!it.descricao) { toast('Informe a descrição do acessório'); inp('descricao').focus(); return false; }
    if (!it.data) it.data = insp.dataInicio;
    if (it.ordem == null) it.ordem = Date.now();
    it.thumbs = thumbs;
    clearTimeout(draftT);
    try { await DB.saveItem(it, fotos); }
    catch (e) { toast('Não foi possível salvar: memória do aparelho cheia. Exporte um backup e libere espaço.', 5000); return false; }
    const fx = {}; pins.forEach(k => { fx[k] = it[k]; }); if (pins.has('descricao')) fx.tipo = it.tipo;
    const atual = await DB.get('inspecoes', insp.id); if (atual) { atual.fixos = fx; await DB.put('inspecoes', atual); }
    await clearDraft();
    await recount(insp.id);
    return true;
  };
  $('#back').onclick = async () => { clearTimeout(draftT); await clearDraft(); go('detail', { id: insp.id }); };
  $('#save').onclick = async () => { if (await save()) { toast('Acessório salvo'); go('detail', { id: insp.id }); } };
  $('#saveCopy').onclick = async () => { if (await save()) { toast('Salvo. Dados copiados para o próximo'); go('item', { inspId: insp.id, copyFrom: it.id }); } };
  $('#menu').onclick = async () => {
    const op = await choose(isNew ? 'Novo acessório' : (up(it.descricao) || 'Acessório'), [
      { label: 'Gerar certificado deste item (PDF)', value: 'pdf', cls: 'ghost' },
      ...(!isNew ? [{ label: 'Excluir acessório', value: 'del', cls: 'danger' }] : []),
      { label: 'Cancelar', value: null, cls: 'ghost' }]);
    if (op === 'pdf') working('Gerando PDF…', async () => { if (await save()) await pdfItem(insp, it, fotos); });
    else if (op === 'del') {
      if (!(await ask('Excluir este acessório e suas fotos?', 'Excluir', true))) return;
      clearTimeout(draftT); await clearDraft(); await DB.delItem(it.id); await recount(insp.id); toast('Acessório excluído'); go('detail', { id: insp.id });
    }
  };
}

/* ---------- Tela: ajustes ---------- */
async function vCfg(v, app) {
  let logo = CFG.logo;
  let est = '';
  try { const e = await navigator.storage?.estimate?.(); if (e && e.usage != null) est = `Usando ${(e.usage / 1048576).toFixed(0)} MB${e.quota ? ` de ${(e.quota / 1073741824).toFixed(1)} GB disponíveis` : ''}.`; } catch (e) {}
  try { const p = await navigator.storage?.persisted?.(); est += p ? ' Armazenamento protegido contra limpeza automática.' : ' O navegador pode limpar os dados se o aparelho ficar sem espaço, então mantenha backups.'; } catch (e) {}
  app.innerHTML = `${topbar('Ajustes', true)}
  <div class="wrap">
    <section class="block"><h2>Padrões para novas inspeções</h2>
      ${field('Empresa', 'empresa', CFG.empresa)}
      <div class="grid2">${field('Filial', 'filial', CFG.filial)}${field('Certificação', 'certificacao', CFG.certificacao)}</div>
      ${field('E-mail', 'email', CFG.email, 'type="email"')}
      ${field('Tipo de inspeção', 'tipoInspecao', CFG.tipoInspecao)}
    </section>
    <section class="block"><h2>Responsáveis (rodapé do certificado)</h2>
      <div class="grid2">${field('Inspetor', 'inspetor', CFG.inspetor)}${field('Registro do inspetor', 'regInspetor', CFG.regInspetor)}</div>
      <div class="grid2">${field('Responsável técnico', 'respTecnico', CFG.respTecnico)}${field('Registro (CREA)', 'regResp', CFG.regResp)}</div>
    </section>
    <section class="block"><h2>Cabeçalho do formulário</h2>
      <div class="logo-prev" id="logoPrev"></div>
      <div class="row" style="margin-bottom:12px"><button class="btn ghost" id="logoBtn">Escolher logo</button><button class="btn ghost" id="logoRm">Remover logo</button></div>
      <input type="file" accept="image/*" id="logoFile" hidden>
      <div class="grid2">${field('Código', 'formCodigo', CFG.formCodigo)}${field('Revisão', 'formRevisao', CFG.formRevisao)}</div>
      ${field('Data do formulário', 'formData', CFG.formData)}
    </section>
    <section class="block"><h2>Leitura de etiqueta (IA)</h2>
      ${field('Endereço do serviço de IA', 'iaUrl', CFG.iaUrl || '', 'type="url" inputmode="url" placeholder="https://inspecao-ia.SEU-NOME.workers.dev"')}
      <p class="hint">Cole aqui o endereço do Worker criado no Cloudflare. Em branco, o botão "Ler etiqueta" não aparece.</p>
    </section>
    <section class="block"><h2>Backup e cópia do app</h2>
      <div class="stack">
        <button class="btn ghost" id="exp">Exportar backup (.json)</button>
        <button class="btn ghost" id="imp">Importar backup</button>
        <input type="file" accept=".json,.txt,application/json,text/plain" id="impFile" hidden>
      </div>
      <p class="hint">O backup leva inspeções, acessórios, fotos e ajustes. Use para trocar de celular ou se for limpar os dados do navegador. ${esc(est)}</p>
    </section>
  </div>
  <div class="dock"><button class="btn" id="save">Salvar ajustes</button></div>`;
  const paintLogo = () => { $('#logoPrev').innerHTML = safeImg(logo) ? `<img src="${safeImg(logo)}" alt="Logo">` : 'Sem logo: o PDF mostra o nome da empresa'; };
  paintLogo();
  $('#back').onclick = () => go('home');
  $('#logoBtn').onclick = () => $('#logoFile').click();
  $('#logoRm').onclick = () => { logo = ''; paintLogo(); };
  $('#logoFile').onchange = async e => { const f = e.target.files[0]; e.target.value = ''; if (!f) return; try { logo = await compress(f, 700, 'image/png'); paintLogo(); } catch (x) { toast('Não foi possível ler essa imagem'); } };
  $('#save').onclick = async () => {
    $$('[data-f]').forEach(el => CFG[el.dataset.f] = el.value.trim());
    CFG.logo = logo; await DB.put('config', CFG, 'cfg'); toast('Ajustes salvos'); go('home');
  };
  $('#exp').onclick = e => busy(e.currentTarget, 'Preparando…', () => exportBackup());
  $('#imp').onclick = () => $('#impFile').click();
  $('#impFile').onchange = async e => {
    const f = e.target.files[0]; e.target.value = ''; if (!f) return;
    try {
      toast('Lendo backup…', 600000);
      const { d, fs } = await lerBackup(f);
      if (d.app !== 'inspecao-acessorios' || !Array.isArray(d.inspecoes) || !Array.isArray(d.itens)) throw new Error('Arquivo não é um backup deste app');
      $('#toast').classList.remove('on');
      if (!(await ask(`Importar ${d.inspecoes.length} inspeç${d.inspecoes.length === 1 ? 'ão' : 'ões'} e ${d.itens.length} acessórios? Registros iguais aos atuais serão substituídos.`, 'Importar'))) return;
      toast('Importando…', 600000);
      await tx(['inspecoes', 'itens', 'config', 'fotos'], 'readwrite', t => {
        d.inspecoes.forEach(i => t.objectStore('inspecoes').put(i));
        d.itens.forEach(i => t.objectStore('itens').put(i));
        Object.entries(d.fotos || {}).forEach(([k, v]) => t.objectStore('fotos').put(v, k));
        if (d.config) t.objectStore('config').put(Object.assign({}, CFG_DEFAULT, d.config), 'cfg');
        t.objectStore('config').put(false, 'v2');
      });
      if (fs) await importarFotos(fs, n => toast(`Importando fotos… ${n}`, 600000));
      await migrate(); await loadCfg(); toast('Backup importado'); go('home');
    } catch (x) { toast(x instanceof SyntaxError ? 'Arquivo inválido ou incompleto. Escolha o .json de backup do app.' : 'Erro: ' + x.message, 4500); }
  };

}

/* ---------- App instalável (PWA) ---------- */
let installEvt = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; if (view.name === 'home') render(); });
window.addEventListener('appinstalled', () => { installEvt = null; toast('App instalado'); });
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(e => console.warn('SW', e)));
}

/* ---------- Início ---------- */
(async () => {
  getDownloads();
  try {
    _db = await openDB();
    try { navigator.storage?.persist?.(); } catch (e) {}
    await loadCfg();
    await migrate();
    await render();
    armBack();
  } catch (e) {
    console.error(e);
    $('#app').innerHTML = `${topbar('Inspeções de acessórios', true)}<div class="wrap"><div class="block"><h2>Armazenamento indisponível</h2><p>Este navegador bloqueou a memória local (pode ser aba anônima). Abra em uma aba normal para salvar as inspeções no aparelho.</p></div></div>`;
  }
})();
</script>
</body>
</html>
